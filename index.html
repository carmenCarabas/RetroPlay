<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RetroPlay — Console Gaming Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #080a0f;
    --dark: #0d1117;
    --dark-mid: #131920;
    --dark-card: #161d26;
    --blue: #2563eb;
    --blue-bright: #3b82f6;
    --blue-dim: #1d4ed8;
    --blue-glow: rgba(37,99,235,0.15);
    --gray-dark: #1e2936;
    --gray-mid: #374151;
    --gray: #6b7280;
    --gray-light: #9ca3af;
    --white: #f8fafc;
    --white-dim: rgba(248,250,252,0.08);
    --white-border: rgba(248,250,252,0.1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 3rem;
    border-bottom: 1px solid var(--white-border);
    background: rgba(8,10,15,0.9);
    backdrop-filter: blur(16px);
  }
  .nav-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.7rem;
    color: var(--white);
    letter-spacing: 0.1em;
  }
  .nav-logo span { color: var(--blue-bright); }
  .nav-links { display: flex; gap: 2.2rem; list-style: none; }
  .nav-links a {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--gray);
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--white); }
  .nav-cta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--white);
    background: var(--blue);
    padding: 0.55rem 1.3rem;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: background 0.2s;
  }
  .nav-cta:hover { background: var(--blue-bright); }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    padding: 8rem 3rem 4rem;
    position: relative;
    overflow: hidden;
    gap: 3rem;
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 50% at 65% 55%, rgba(37,99,235,0.09) 0%, transparent 70%),
      radial-gradient(ellipse 30% 40% at 10% 90%, rgba(37,99,235,0.05) 0%, transparent 60%);
  }
  .hero-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  .hero-left { position: relative; z-index: 2; }
  .hero-tag {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--blue-bright);
    border: 1px solid rgba(59,130,246,0.4);
    padding: 0.3rem 0.9rem;
    margin-bottom: 1.6rem;
  }
  .hero-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4.5rem, 8vw, 7.5rem);
    line-height: 0.9;
    letter-spacing: 0.03em;
    color: var(--white);
    margin-bottom: 0.3rem;
  }
  .hero-title span { color: var(--blue-bright); display: block; }
  .hero-sub {
    font-size: 1rem;
    color: var(--gray-light);
    max-width: 420px;
    margin-bottom: 2.5rem;
    line-height: 1.8;
    font-weight: 300;
  }
  .hero-price-row {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 2.2rem;
  }
  .hero-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.5rem;
    color: var(--white);
    letter-spacing: 0.04em;
  }
  .hero-price-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    color: var(--gray);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    line-height: 1.6;
  }
  .hero-btns { display: flex; gap: 1rem; }
  .btn-primary {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--white);
    background: var(--blue);
    padding: 0.95rem 2rem;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    display: inline-block;
  }
  .btn-primary:hover { background: var(--blue-bright); transform: translateY(-2px); }
  .btn-secondary {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--gray-light);
    border: 1px solid var(--white-border);
    padding: 0.95rem 2rem;
    text-decoration: none;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-secondary:hover { border-color: var(--gray-light); color: var(--white); }

  /* HERO IMAGE */
  .hero-right {
    position: relative; z-index: 2;
    display: flex; justify-content: center; align-items: center;
  }
  .product-frame {
    position: relative;
    width: 100%;
    max-width: 520px;
  }
  .product-frame::before {
    content: '';
    position: absolute;
    inset: -1px;
    border: 1px solid rgba(59,130,246,0.3);
    pointer-events: none;
  }
  .product-frame::after {
    content: '';
    position: absolute;
    bottom: -30px; left: 10%;
    width: 80%; height: 30px;
    background: radial-gradient(ellipse, rgba(37,99,235,0.25) 0%, transparent 70%);
    filter: blur(8px);
  }
  .product-img {
    width: 100%;
    display: block;
  }
  .product-badges {
    position: absolute;
    top: 1rem; right: -1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .pbadge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.58rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0.3rem 0.7rem;
    background: var(--dark-card);
    border: 1px solid var(--white-border);
    color: var(--gray-light);
    white-space: nowrap;
  }
  .pbadge.active { border-color: var(--blue); color: var(--blue-bright); }

  /* MARQUEE */
  .marquee-wrap {
    overflow: hidden;
    border-top: 1px solid var(--white-border);
    border-bottom: 1px solid var(--white-border);
    background: var(--dark);
    padding: 0.7rem 0;
  }
  .marquee-track {
    display: flex;
    gap: 2.5rem;
    width: max-content;
    animation: marquee 22s linear infinite;
  }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .marquee-item {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--gray);
  }
  .marquee-item span { color: var(--blue-bright); margin: 0 0.8rem; }

  /* COMMON SECTION */
  section { padding: 7rem 3rem; }
  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--blue-bright);
    margin-bottom: 1rem;
  }
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 5vw, 4.2rem);
    line-height: 0.95;
    letter-spacing: 0.03em;
    color: var(--white);
    margin-bottom: 1.5rem;
  }

  /* CTA */
  .cta-section {
    background: var(--blue-dim);
    padding: 6rem 3rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .cta-section::before {
    content: 'RETROPLAY';
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18vw;
    color: rgba(0,0,0,0.12);
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    pointer-events: none;
    letter-spacing: 0.05em;
  }
  .cta-section h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    color: var(--white);
    letter-spacing: 0.04em;
    margin-bottom: 0.5rem;
    position: relative;
  }
  .cta-section p { color: rgba(255,255,255,0.65); font-size: 0.95rem; margin-bottom: 2rem; position: relative; }
  .btn-white {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--blue-dim);
    background: var(--white);
    padding: 1rem 2.5rem;
    text-decoration: none;
    position: relative;
    transition: background 0.2s, transform 0.15s;
    display: inline-block;
  }
  .btn-white:hover { background: #e2e8f0; transform: translateY(-2px); }

  /* FOOTER */
  footer {
    background: var(--black);
    border-top: 1px solid var(--white-border);
    padding: 2rem 3rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem; color: var(--white); letter-spacing: 0.08em;
  }
  .footer-logo span { color: var(--blue-bright); }
  .footer-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.58rem; color: var(--gray);
    text-transform: uppercase; letter-spacing: 0.1em;
  }

  /* SCROLL REVEAL */
  .fade-up {
    opacity: 0; transform: translateY(24px);
    transition: opacity 0.65s ease, transform 0.65s ease;
  }
  .fade-up.visible { opacity: 1; transform: translateY(0); }

  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; padding: 7rem 1.5rem 4rem; }
    .hero-right { display: none; }
    .features-grid, .unique-layout, .pricing-grid, .channels-grid { grid-template-columns: 1fr; }
    nav { padding: 1rem 1.5rem; }
    .nav-links { display: none; }
    section { padding: 5rem 1.5rem; }
    footer { flex-direction: column; gap: 1rem; text-align: center; }
  }
</style>
</head>
